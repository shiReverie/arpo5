name: Unity 2D Platformer CI/CD

on:
  push:
    branches: [ "master" ]

env:
  UNITY_VERSION: 6000.6.3f1

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then echo "✅ ProjectSettings найден."; else echo "❌ Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "✅ Packages найден."; else echo "❌ Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print || true
          find Assets/ -name "BuildManager.cs" -print || true

  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Run Unity Tests (Playmode)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: playmode
          dockerShmSize: 1025m
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Artifacts Permissions
        if: always()
        run: |
          echo "=== Исправление прав доступа к артефактам ==="
          if [ -d "artifacts" ]; then
            sudo chown -R $(whoami):$(id -g) artifacts/ || true
            echo "Содержимое папки artifacts:"
            ls -la artifacts/ || echo "Папка пуста"
          else
            echo "Папка artifacts не создана (тесты не найдены)"
            mkdir -p artifacts
          fi

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  build_game:
    needs: run_tests
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space
        run: |
          echo "=== Освобождение места на диске ==="
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          docker image prune -af || true
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-Build-${{ runner.os }}-${{ env.UNITY_VERSION }}-v2-

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: BuildManager.BuildWebGL
          buildsPath: Builds/WebGL
          dockerShmSize: 4g
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Build Output
        run: |
          echo "=== Проверка результата сборки ==="
          if [ -d "Builds/WebGL" ]; then
            echo "✅ Папка Builds/WebGL создана"
            ls -la Builds/WebGL/
          else
            echo "❌ Папка Builds/WebGL не найдена!"
            exit 1
          fi

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL
          retention-days: 7

  mirror_repo:
    needs: run_tests
    if: github.repository == 'shiReverie/arpo2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== ❌ ОШИБКА: BACKUP_TOKEN is empty! Create a PAT with scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== ✅ BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/shiReverie/arpo2_backup.git master
          echo "=== ✅ Код успешно продублирован ==="

  build_docker_image:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Verify WebGL build exists
        run: |
          if [ ! -d "Builds/WebGL" ]; then
            echo "❌ WebGL build not found!"
            exit 1
          fi
          ls -la Builds/WebGL/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/shireverie/platformer-game:latest
            ghcr.io/shireverie/platformer-game:${{ github.sha }}

  deploy_to_pages:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages
          clean: true
