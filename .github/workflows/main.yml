name: Unity 2D Platformer CI/CD

on:
  push:
    branches: [ "master" ]

# Глобально ограничиваем время, чтобы «зависание» не висело 6 часов
env:
  UNITY_VERSION: 6000.6.3f1

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          test -d ProjectSettings || { echo "ProjectSettings не найден"; exit 1; }
          test -d Packages || { echo "Packages не найден"; exit 1; }
          echo "ProjectSettings и Packages найдены."
          echo "Unity version in project: $(grep -E 'm_EditorVersion' ProjectSettings/ProjectVersion.txt || true)"

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print 2>/dev/null || true
          find Assets/ -name "BuildManager.cs" -print 2>/dev/null || true
          find Assets/ -name "*.asmdef" -print 2>/dev/null || true

      - name: Verify Unity Docker Image Exists
        run: |
          echo "=== Проверка docker-образа для тестов ==="
          docker manifest inspect unityci/editor:${UNITY_VERSION}-linux-il2cpp-3 > /dev/null \
            || { echo "НЕТ ОБРАЗА: unityci/editor:${UNITY_VERSION}-linux-il2cpp-3"; exit 1; }
          echo "=== Проверка docker-образа для WebGL ==="
          docker manifest inspect unityci/editor:${UNITY_VERSION}-linux-webgl-3 > /dev/null \
            || { echo "НЕТ ОБРАЗА: unityci/editor:${UNITY_VERSION}-linux-webgl-3"; exit 1; }
          echo "Образы найдены."

  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-${{ runner.os }}-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/

  build_game:
    needs: run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      build_status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-Build-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BuildManager.BuildWebGL
          unityVersion: ${{ env.UNITY_VERSION }}
          versioning: None

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  mirror_repo:
    needs: run_tests
    if: github.repository == 'shiReverie/arpo2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== ОШИБКА: BACKUP_TOKEN пуст. Создайте PAT со scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== BACKUP_TOKEN установлен (длина: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало зеркалирования ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/shiReverie/arpo2_backup.git master
          echo "=== Код успешно продублирован ==="

  build_docker_image:
    needs: build_game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/shireverie/platformer-game:latest
            ghcr.io/shireverie/platformer-game:${{ github.sha }}

  deploy_to_pages:
    needs: build_game
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages